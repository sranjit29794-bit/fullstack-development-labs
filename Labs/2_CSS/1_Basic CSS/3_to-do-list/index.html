<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Styled To-Do List</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@500;600&family=Exo+2:wght@500&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
<div>

    <main>
        <h1>Shadow Quest System</h1>
        <ul class="todo-list">
        <h2>Active Daily Missions</h2>
            <li>
                <input type="checkbox" id="q1">
                <label for="q1">Complete Today's Frontend Mission</label>
                <ul class="sub-item">
                    <li>
                        <a class="sub-item-link" href="https://www.freecodecamp.org/learn/" target="_blank">freeCodeCamp Lesson</a>
                    </li>
                </ul>
            </li>
            
            <li>
                <input type="checkbox" id="q2">
                <label for="q2">Build a CSS Component</label>
                <ul class="sub-item">
                    <li>
                        <a class="sub-item-link" href="https://css-tricks.com/" target="_blank">CSS Tricks</a>
                    </li>
                </ul>
            </li>

            <li>
                <input type="checkbox" id="q3">
                <label for="q3">Solve One DSA Challenge</label>
                <ul class="sub-item">
                    <li>
                        <a class="sub-item-link" href="https://leetcode.com/" target="_blank">LeetCode</a>
                    </li>
                </ul>
            </li>

            <li>
                <input type="checkbox" id="q4">
                <label for="q4">Push Today's Progress</label>
                <ul class="sub-item">
                    <li>
                        <a class="sub-item-link" href="https://github.com/" target="_blank">Github Repository</a>
                    </li>
                </ul>
            </li>
        </ul>
    </main>
</div>
</body>
</html>
